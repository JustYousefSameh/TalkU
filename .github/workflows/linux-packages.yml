name: Linux packages

# Attaches the .deb and .rpm to a published GitHub release, which is also what
# the AUR talku-bin package downloads (packaging/aur/talku-bin).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    name: deb + rpm
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the daemon and stage the pinned wstunnel
        run: bun run prepare:linux

      - name: Build deb and rpm
        run: bun run tauri build

      # The .deb is named after src-tauri/tauri.conf.json, and the AUR PKGBUILD
      # derives its URL from the tag, so the two have to agree.
      - name: Check the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::release tag $tag does not match src-tauri/tauri.conf.json version $version (expected v$version)"
            exit 1
          fi

      - name: Attach packages to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            target/release/bundle/deb/TalkU_*_amd64.deb
            target/release/bundle/rpm/TalkU-*.x86_64.rpm

      - name: Upload packages as workflow artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/release/bundle/deb/TalkU_*_amd64.deb
            target/release/bundle/rpm/TalkU-*.x86_64.rpm
