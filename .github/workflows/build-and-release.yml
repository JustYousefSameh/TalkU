name: Build and Release

# Builds Linux (.deb, .rpm) and Windows (.exe NSIS installer) packages.
# - On branch push / manual workflow_dispatch: uploads packages as workflow artifacts for testing.
# - On a published GitHub Release: validates tag == tauri.conf.json version and attaches all assets.
on:
  push:
    branches:
      - linux_port
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libasound2-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and stage talku-cli daemon
        run: bun run prepare:linux

      - name: Build deb and rpm
        run: bun run tauri build --bundles deb,rpm

      - name: Check the tag matches the packaged version
        if: github.event_name == 'release'
        run: |
          version=$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')
          tag="${{ github.event.release.tag_name }}"
          if [ "v$version" != "$tag" ]; then
            echo "::error::release tag $tag does not match src-tauri/tauri.conf.json version $version (expected v$version)"
            exit 1
          fi

      - name: Attach Linux packages to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            target/release/bundle/deb/TalkU_*_amd64.deb
            target/release/bundle/rpm/TalkU-*.x86_64.rpm

      - name: Upload Linux packages as workflow artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          if-no-files-found: error
          path: |
            target/release/bundle/deb/TalkU_*_amd64.deb
            target/release/bundle/rpm/TalkU-*.x86_64.rpm

  windows:
    name: Windows (NSIS installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and stage talku-cli.exe daemon
        shell: pwsh
        run: |
          cargo build --release -p talku-cli
          New-Item -ItemType Directory -Force -Path src-tauri/resources | Out-Null
          Copy-Item target/release/talku-cli.exe src-tauri/resources/talku-cli.exe -Force

      - name: Build Windows installer
        run: bun run tauri build --bundles nsis

      - name: Check the tag matches the packaged version
        if: github.event_name == 'release'
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "${{ github.event.release.tag_name }}"
          if ("v$version" -ne $tag) {
            Write-Error "release tag $tag does not match src-tauri/tauri.conf.json version $version (expected v$version)"
            exit 1
          }

      - name: Attach Windows installer to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            target/release/bundle/nsis/TalkU_*_x64-setup.exe

      - name: Upload Windows installer as workflow artifacts
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          if-no-files-found: error
          path: |
            target/release/bundle/nsis/TalkU_*_x64-setup.exe
