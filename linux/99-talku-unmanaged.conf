# TalkU owns the wg0 WireGuard interface: the root daemon creates, configures,
# and removes it through netlink (addresses, routes, DNS).
#
# Without this, NetworkManager "assumes" the externally created interface as a
# WireGuard connection. GNOME then lists it as a VPN, and when TalkU removes the
# interface on disconnect NetworkManager deactivates that connection with a
# reason other than "user disconnected" — which GNOME reports as
#   "Connection failed — Activation of network connection failed"
# even though the disconnect itself succeeded.
#
# Keeping the device unmanaged also stops NetworkManager from racing TalkU for
# the interface's IP configuration. NetworkManager only reads this file at
# startup or on reload, so a reload (or reboot) is needed after installing it.
[keyfile]
unmanaged-devices=interface-name:wg0
