[package]
name = "talku-cli"
version.workspace = true
edition.workspace = true
description = "Standalone elevated WireGuard helper for TalkU"
build = "build.rs"

[dependencies]
defguard_wireguard_rs = "0.11.2"
log = "0.4"
netstat2 = "0.11"
sysinfo = "0.30"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.52", features = ["Win32_Security_Authorization", "Win32_Foundation", "Win32_Security"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[build-dependencies]
embed-resource = "2"
